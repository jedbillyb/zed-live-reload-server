id = "live-reload-server"
name = "Live Reload Server"
version = "0.4.6"
schema_version = 1
authors = ["jedbillyb <hello@jedbillyb.com>"]
description = "Serve a project locally and reload the browser as you edit. CSS and images swap in place, everything else reloads and keeps its scroll position."
repository = "https://github.com/jedbillyb/zed-live-reload-server"

[language_servers.live-reload-server]
name = "Live Reload Server"
languages = ["HTML", "CSS", "JavaScript", "TypeScript", "TSX", "Markdown"]

[language_servers.live-reload-server.language_ids]
"HTML" = "html"
"CSS" = "css"
"JavaScript" = "javascript"
"TypeScript" = "typescript"
"TSX" = "typescriptreact"
"Markdown" = "markdown"
