[package]
name = "live-reload-server"
version = "0.4.4"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `server/` is deliberately its own workspace root, so building this extension
# for wasm32-wasip2 never tries to resolve the native server's dependency tree.
[workspace]
