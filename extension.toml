id = "live-reload-server"
name = "Live Reload Server"
version = "0.4.4"
schema_version = 1
authors = ["jedbillyb <jedbillyb@gmail.com>"]
description = "Local development server with live reload, modelled on the VS Code Live Server extension."
repository = "https://github.com/jedbillyb/zed-live-reload-server"

[language_servers.live-reload-server]
name = "Live Reload Server"
languages = ["HTML", "CSS", "JavaScript", "TypeScript", "TSX", "Markdown"]

[language_servers.live-reload-server.language_ids]
"HTML" = "html"
"CSS" = "css"
"JavaScript" = "javascript"
"TypeScript" = "typescript"
"TSX" = "typescriptreact"
"Markdown" = "markdown"
